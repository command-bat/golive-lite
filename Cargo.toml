[package]
name = "golive-lite"
version = "0.1.2"
edition = "2021"
description = "Go Live - Lite (Go Live Lite - Desktop) - Cliente nativo ultra-leve em Rust"

[[bin]]
name = "golive-lite"
path = "src/main.rs"

[features]
default = ["mod_ferramentas", "mod_permissoes_chamada", "mod_perfil", "mod_amigos"]
mod_ferramentas = []
mod_permissoes_chamada = []
mod_perfil = []
mod_amigos = []

[dependencies]
# GUI Nativa Imediata Ultra-Leve (OpenGL/WGL nativo via glow, sem WebView/Chromium)
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui = { version = "0.29", default-features = false, features = ["default_fonts"] }

# Runtime assincrono minimalista e WebSocket com TLS nativo do Windows (schannel)
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "net", "sync", "time", "macros", "io-util", "process"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
url = "2"

# HTTP REST leve com TLS nativo do sistema (para /auth/login, /auth/me, /ice-servers)
ureq = { version = "2", default-features = false, features = ["json", "native-tls"] }
native-tls = "0.2"

# Serializacao JSON do protocolo GoLive
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"

# Audio I/O nativo de baixo nivel (WASAPI no Windows)
cpal = "0.15"

# Codecs padrao WebRTC (Opus puro em Rust + Cisco OpenH264 estatico)
ropus = "0.12"
openh264 = "0.9"

# WebRTC puro em Rust para interoperabilidade de midia com GoLive Web/Desktop
webrtc = "0.11"

# Bindings minimos da API Win32 (captura de tela GDI, enumeracao de monitores/janelas, hotkey PTT)
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
] }

# Bindings COM/DXGI/D3D11/Media Foundation/WinRT Capture (versao 0.54.0 ja em cache) para captura GPU zero-copy e H.264 HW
windows = { version = "0.54.0", features = [
    "Foundation",
    "Foundation_Numerics",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Media_DirectShow",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

# Otimizacoes de tamanho e desempenho mantendo binario compacto e baixo uso de RAM
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package.openh264]
opt-level = 3

[profile.release.package.openh264-sys2]
opt-level = 3

[profile.release.package.ropus]
opt-level = 3

[profile.dev]
opt-level = 1

# Patch local da webrtc-dtls 0.10.0 para compatibilidade com Chrome/Edge/Firefox modernos
# (GREASE, grupos pos-quanticos X25519MLKEM768/0x11EC, ClientHello fragmentado >1200B, session_id e RFC 8422)
[patch.crates-io]
webrtc-dtls = { path = "patches/webrtc-dtls" }

[workspace]
members = [".", "installer"]
